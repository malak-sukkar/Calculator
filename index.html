<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Calculator</title>
</head>

<body>

    <main class="page">
        <header class="brand">
            <div class="brand-mark" aria-hidden="true"><i class="fa-solid fa-calculator"></i></div>
            <div>
                <p class="eyebrow">EVERYDAY TOOLS</p>
                <h1>Calculator</h1>
            </div>
        </header>
        <section class="container" aria-label="Calculator">
            <div class="a">
                <div class="output" role="status" aria-live="polite" aria-label="Display"></div>
                <div class="display-actions">
                    <button class="clear" type="button" aria-label="Clear all">AC</button>
                    <button class="remove" type="button" aria-label="Delete last character">
                        <i class="fa-solid fa-delete-left" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div class="b">
                <button class="seven" type="button">7</button>
                <button class="eight" type="button">8</button>
                <button class="nine" type="button">9</button>
                <button class="divid" type="button">÷</button>
            </div>
            <div class="c">
                <button class="four" type="button">4</button>
                <button class="five" type="button">5</button>
                <button class="six" type="button">6</button>
                <button class="multiple" type="button">*</button>
            </div>
            <div class="d">
                <button class="one" type="button">1</button>
                <button class="tow" type="button">2</button>
                <button class="three" type="button">3</button>
                <button class="minus" type="button">-</button>
            </div>
            <div class="e">
                <button class="comma" type="button">.</button>
                <button class="zero" type="button">0</button>
                <button class="eql" type="button">=</button>
                <button class="plus" type="button">+</button>
            </div>
        </section>
    </main>




    <script src="main.js"></script>
</body>

</html>
